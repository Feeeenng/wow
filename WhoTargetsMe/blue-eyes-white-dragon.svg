<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <!-- 背景 -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="60%" stop-color="#0088cc"/>
      <stop offset="100%" stop-color="#003366"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0ff"/>
      <stop offset="40%" stop-color="#c0d8f0"/>
      <stop offset="100%" stop-color="#8098c0"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d0e0ff"/>
      <stop offset="100%" stop-color="#6078a0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- 光晕 -->
  <ellipse cx="400" cy="350" rx="250" ry="200" fill="#0066cc" opacity="0.15" filter="url(#bigGlow)"/>

  <!-- ===== 左翼 ===== -->
  <path d="M340,400 Q200,250 120,180 Q60,130 80,100 Q100,80 140,120 Q200,180 260,280 L300,380 Z"
        fill="url(#wingGrad)" stroke="#5068a0" stroke-width="2"/>
  <path d="M320,400 Q240,280 180,200 Q140,140 100,160 Q120,190 200,280 L280,380 Z"
        fill="#a0b8e0" opacity="0.6"/>
  <path d="M260,350 Q180,260 130,220 Q170,230 230,310 L280,370 Z"
        fill="#c8d8f0" opacity="0.5"/>
  <!-- 左翼骨架 -->
  <line x1="340" y1="400" x2="120" y2="180" stroke="#7088b0" stroke-width="2.5"/>
  <line x1="340" y1="400" x2="160" y2="100" stroke="#7088b0" stroke-width="2"/>
  <line x1="340" y1="400" x2="100" y2="240" stroke="#7088b0" stroke-width="2"/>

  <!-- ===== 右翼 ===== -->
  <path d="M460,400 Q600,250 680,180 Q740,130 720,100 Q700,80 660,120 Q600,180 540,280 L500,380 Z"
        fill="url(#wingGrad)" stroke="#5068a0" stroke-width="2"/>
  <path d="M480,400 Q560,280 620,200 Q660,140 700,160 Q680,190 600,280 L520,380 Z"
        fill="#a0b8e0" opacity="0.6"/>
  <path d="M540,350 Q620,260 670,220 Q630,230 570,310 L520,370 Z"
        fill="#c8d8f0" opacity="0.5"/>
  <!-- 右翼骨架 -->
  <line x1="460" y1="400" x2="680" y2="180" stroke="#7088b0" stroke-width="2.5"/>
  <line x1="460" y1="400" x2="640" y2="100" stroke="#7088b0" stroke-width="2"/>
  <line x1="460" y1="400" x2="700" y2="240" stroke="#7088b0" stroke-width="2"/>

  <!-- ===== 身体 ===== -->
  <ellipse cx="400" cy="480" rx="70" ry="110" fill="url(#bodyGrad)" stroke="#5068a0" stroke-width="2"/>
  <!-- 胸部高光 -->
  <ellipse cx="385" cy="470" rx="35" ry="70" fill="white" opacity="0.3"/>

  <!-- ===== 腹部鳞片 ===== -->
  <path d="M360,420 Q400,440 440,420" fill="none" stroke="#7088b0" stroke-width="1.5" opacity="0.6"/>
  <path d="M355,450 Q400,470 445,450" fill="none" stroke="#7088b0" stroke-width="1.5" opacity="0.6"/>
  <path d="M358,480 Q400,500 442,480" fill="none" stroke="#7088b0" stroke-width="1.5" opacity="0.6"/>
  <path d="M362,510 Q400,530 438,510" fill="none" stroke="#7088b0" stroke-width="1.5" opacity="0.6"/>
  <path d="M367,540 Q400,555 433,540" fill="none" stroke="#7088b0" stroke-width="1.5" opacity="0.6"/>

  <!-- ===== 脖子 ===== -->
  <path d="M370,430 Q350,340 360,250 Q365,210 380,200 L420,200 Q435,210 440,250 Q450,340 430,430 Z"
        fill="url(#bodyGrad)" stroke="#5068a0" stroke-width="2"/>
  <!-- 脖子高光 -->
  <path d="M380,420 Q370,340 375,260 Q378,220 390,210" fill="none" stroke="white" stroke-width="4" opacity="0.3"/>

  <!-- ===== 头部 ===== -->
  <!-- 头部主体 -->
  <path d="M340,220 Q330,150 360,100 Q385,60 415,60 Q445,100 460,150 Q470,220 460,280 Q450,310 430,320
           L370,320 Q350,310 340,280 Z"
        fill="url(#bodyGrad)" stroke="#5068a0" stroke-width="2.5"/>

  <!-- 下颚 -->
  <path d="M360,280 Q350,320 370,340 Q400,360 430,340 Q450,320 440,280 Z"
        fill="#d8e8ff" stroke="#5068a0" stroke-width="2"/>
  <path d="M370,340 Q400,350 430,340" fill="none" stroke="#5068a0" stroke-width="1.5"/>

  <!-- 上颚/嘴部 -->
  <path d="M365,290 Q380,310 400,315 Q420,310 435,290" fill="none" stroke="#5068a0" stroke-width="2"/>

  <!-- ===== 牙齿 ===== -->
  <polygon points="370,295 373,310 376,296" fill="white" stroke="#8898b0" stroke-width="0.5"/>
  <polygon points="380,300 384,316 388,301" fill="white" stroke="#8898b0" stroke-width="0.5"/>
  <polygon points="392,303 396,318 400,304" fill="white" stroke="#8898b0" stroke-width="0.5"/>
  <polygon points="404,303 408,318 412,304" fill="white" stroke="#8898b0" stroke-width="0.5"/>
  <polygon points="416,300 420,316 424,301" fill="white" stroke="#8898b0" stroke-width="0.5"/>
  <polygon points="426,295 429,310 432,296" fill="white" stroke="#8898b0" stroke-width="0.5"/>
  <!-- 下颚牙齿 -->
  <polygon points="378,305 382,318 386,304" fill="white" stroke="#8898b0" stroke-width="0.5"/>
  <polygon points="392,307 396,320 400,306" fill="white" stroke="#8898b0" stroke-width="0.5"/>
  <polygon points="408,307 412,320 416,306" fill="white" stroke="#8898b0" stroke-width="0.5"/>
  <polygon points="422,305 426,318 430,304" fill="white" stroke="#8898b0" stroke-width="0.5"/>

  <!-- ===== 眼睛 ===== -->
  <!-- 左眼 -->
  <ellipse cx="380" cy="150" rx="22" ry="18" fill="url(#eyeGlow)" stroke="#003366" stroke-width="2" filter="url(#glow)"/>
  <ellipse cx="380" cy="150" rx="8" ry="16" fill="#001122"/>
  <ellipse cx="384" cy="146" rx="3" ry="4" fill="white" opacity="0.8"/>

  <!-- 右眼 -->
  <ellipse cx="420" cy="150" rx="22" ry="18" fill="url(#eyeGlow)" stroke="#003366" stroke-width="2" filter="url(#glow)"/>
  <ellipse cx="420" cy="150" rx="8" ry="16" fill="#001122"/>
  <ellipse cx="424" cy="146" rx="3" ry="4" fill="white" opacity="0.8"/>

  <!-- ===== 角 ===== -->
  <!-- 左角 -->
  <path d="M355,110 Q330,60 310,20 Q320,15 340,40 Q350,70 365,105 Z"
        fill="#d8e8ff" stroke="#5068a0" stroke-width="1.5"/>
  <!-- 右角 -->
  <path d="M445,110 Q470,60 490,20 Q480,15 460,40 Q450,70 435,105 Z"
        fill="#d8e8ff" stroke="#5068a0" stroke-width="1.5"/>

  <!-- 额头宝石 -->
  <polygon points="400,90 390,110 400,130 410,110" fill="#00ccff" stroke="#0066aa" stroke-width="2" filter="url(#glow)"/>

  <!-- ===== 耳/冠 ===== -->
  <path d="M350,120 Q320,80 310,60 Q325,70 350,110 Z" fill="#c0d8f0" stroke="#5068a0" stroke-width="1.5"/>
  <path d="M450,120 Q480,80 490,60 Q475,70 450,110 Z" fill="#c0d8f0" stroke="#5068a0" stroke-width="1.5"/>

  <!-- ===== 脖子尖刺 ===== -->
  <polygon points="380,250 355,235 375,265" fill="#c0d8f0" stroke="#5068a0" stroke-width="1"/>
  <polygon points="375,280 348,268 368,298" fill="#c0d8f0" stroke="#5068a0" stroke-width="1"/>
  <polygon points="370,310 345,300 363,328" fill="#c0d8f0" stroke="#5068a0" stroke-width="1"/>

  <polygon points="420,250 445,235 425,265" fill="#c0d8f0" stroke="#5068a0" stroke-width="1"/>
  <polygon points="425,280 452,268 432,298" fill="#c0d8f0" stroke="#5068a0" stroke-width="1"/>
  <polygon points="430,310 455,300 437,328" fill="#c0d8f0" stroke="#5068a0" stroke-width="1"/>

  <!-- ===== 左手 ===== -->
  <path d="M345,470 Q300,500 270,530 Q260,550 270,570 L285,575 L295,560 L290,575 L305,578 L310,560
           L305,575 L320,572 L310,555 Q320,540 340,510 Q355,490 345,470 Z"
        fill="url(#bodyGrad)" stroke="#5068a0" stroke-width="2"/>
  <!-- 左手爪 -->
  <polygon points="270,570 260,585 275,578" fill="white" stroke="#8898b0" stroke-width="1"/>
  <polygon points="290,575 285,593 298,580" fill="white" stroke="#8898b0" stroke-width="1"/>
  <polygon points="308,575 306,592 316,578" fill="white" stroke="#8898b0" stroke-width="1"/>

  <!-- ===== 右手 ===== -->
  <path d="M455,470 Q500,500 530,530 Q540,550 530,570 L515,575 L505,560 L510,575 L495,578 L490,560
           L495,575 L480,572 L490,555 Q480,540 460,510 Q445,490 455,470 Z"
        fill="url(#bodyGrad)" stroke="#5068a0" stroke-width="2"/>
  <!-- 右手爪 -->
  <polygon points="530,570 540,585 525,578" fill="white" stroke="#8898b0" stroke-width="1"/>
  <polygon points="510,575 515,593 502,580" fill="white" stroke="#8898b0" stroke-width="1"/>
  <polygon points="492,575 494,592 484,578" fill="white" stroke="#8898b0" stroke-width="1"/>

  <!-- ===== 尾巴 ===== -->
  <path d="M390,580 Q380,650 360,720 Q340,780 300,820 Q270,840 250,830 Q230,820 240,800 Q250,780 280,770
           Q310,755 340,710 Q370,650 385,590 Z"
        fill="url(#bodyGrad)" stroke="#5068a0" stroke-width="2"/>
  <!-- 尾尖 -->
  <path d="M260,820 Q230,800 220,820 Q218,832 220,820 Z" fill="#a0b8e0" stroke="#5068a0" stroke-width="1.5"/>

  <!-- ===== 左腿 ===== -->
  <path d="M360,560 Q340,620 330,670 Q325,700 340,710 L360,710 L355,695 L360,710 L375,705 L365,690
           L370,710 L385,700 Q380,680 375,650 L370,590 Z"
        fill="url(#bodyGrad)" stroke="#5068a0" stroke-width="2"/>
  <!-- 左脚爪 -->
  <polygon points="330,700 320,720 340,712" fill="white" stroke="#8898b0" stroke-width="1"/>
  <polygon points="348,710 345,728 355,714" fill="white" stroke="#8898b0" stroke-width="1"/>
  <polygon points="365,710 365,728 372,710" fill="white" stroke="#8898b0" stroke-width="1"/>

  <!-- ===== 右腿 ===== -->
  <path d="M440,560 Q460,620 470,670 Q475,700 460,710 L440,710 L445,695 L440,710 L425,705 L435,690
           L430,710 L415,700 Q420,680 425,650 L430,590 Z"
        fill="url(#bodyGrad)" stroke="#5068a0" stroke-width="2"/>
  <!-- 右脚爪 -->
  <polygon points="470,700 480,720 460,712" fill="white" stroke="#8898b0" stroke-width="1"/>
  <polygon points="452,710 455,728 445,714" fill="white" stroke="#8898b0" stroke-width="1"/>
  <polygon points="435,710 435,728 428,710" fill="white" stroke="#8898b0" stroke-width="1"/>

  <!-- ===== 破坏光弹（吐息） ===== -->
  <ellipse cx="400" cy="370" rx="18" ry="12" fill="#88ddff" opacity="0.6" filter="url(#glow)"/>
  <ellipse cx="400" cy="395" rx="14" ry="8" fill="#66ccff" opacity="0.5" filter="url(#glow)"/>

  <!-- ===== 标题 ===== -->
  <text x="400" y="900" text-anchor="middle" font-family="serif" font-size="42"
        fill="#4488cc" filter="url(#glow)" font-weight="bold" letter-spacing="8">
    青 眼 白 龍
  </text>
  <text x="400" y="940" text-anchor="middle" font-family="serif" font-size="18"
        fill="#336699" letter-spacing="4">
    Blue-Eyes White Dragon
  </text>

  <!-- 底部光带 -->
  <rect x="150" y="970" width="500" height="2" fill="url(#eyeGlow)" opacity="0.4" rx="1"/>
</svg>
